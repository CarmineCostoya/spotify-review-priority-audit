[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-review-audit"
version = "0.1.0"
description = "Auditable multi-role Spotify review analysis pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spotify-audit = "spotify_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

